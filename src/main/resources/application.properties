spring.application.name=conversational-sql-assistant
server.port=8080

# MySQL Database Configuration
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/industrial_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:7548}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash
