<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial AI - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-900 h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-gray-100 flex flex-col gap-5">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-indigo-50 border border-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-sm">
                <i class="fa-solid fa-industry"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-900 tracking-tight">ConventionalAI Industrial DB</h2>
            <p id="subtitle" class="text-xs text-gray-400 font-medium">Please authorize your credentials to establish secure node connection</p>
        </div>

        <div class="space-y-3.5">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Username Reference</label>
                <input id="loginUser" type="text" autocomplete="username" class="w-full bg-gray-50 text-sm px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Security Token Key</label>
                <input id="loginPass" type="password" autocomplete="current-password" class="w-full bg-gray-50 text-sm px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
            </div>
            <div id="confirmWrap" class="hidden">
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Confirm Token Key</label>
                <input id="loginPass2" type="password" autocomplete="new-password" class="w-full bg-gray-50 text-sm px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
            </div>
        </div>

        <p id="msg" class="text-xs font-semibold text-center min-h-[1rem]"></p>

        <button id="submitBtn" onclick="submitForm()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-md shadow-indigo-600/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-sm">
            <span id="btnText">Authenticate Workspace</span>
            <i class="fa-solid fa-right-to-bracket text-xs"></i>
        </button>

        <p class="text-center text-xs text-gray-500">
            <span id="toggleLabel">New here?</span>
            <a href="#" onclick="toggleMode(); return false;" id="toggleLink" class="text-indigo-600 font-semibold">Create an account</a>
        </p>
    </div>

    <script>
        let mode = "login";

        function showMsg(text, ok) {
            const m = document.getElementById("msg");
            m.textContent = text;
            m.className = "text-xs font-semibold text-center min-h-[1rem] " + (ok ? "text-green-600" : "text-red-600");
        }

        function toggleMode() {
            mode = mode === "login" ? "register" : "login";
            const reg = mode === "register";
            document.getElementById("confirmWrap").classList.toggle("hidden", !reg);
            document.getElementById("btnText").textContent = reg ? "Create Account" : "Authenticate Workspace";
            document.getElementById("toggleLabel").textContent = reg ? "Already registered?" : "New here?";
            document.getElementById("toggleLink").textContent = reg ? "Sign in" : "Create an account";
            document.getElementById("subtitle").textContent = reg
                ? "Choose a username and password (min 6 characters)"
                : "Please authorize your credentials to establish secure node connection";
            showMsg("", true);
        }

        async function submitForm() {
            const username = document.getElementById("loginUser").value.trim();
            const password = document.getElementById("loginPass").value;

            if (!username || !password) { showMsg("Enter username and password.", false); return; }

            if (mode === "register") {
                if (password !== document.getElementById("loginPass2").value) {
                    showMsg("Passwords do not match.", false);
                    return;
                }
                try {
                    const res = await fetch("/api/auth/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showMsg("Account created. You can sign in now.", true);
                        toggleMode();
                        document.getElementById("loginUser").value = username;
                        document.getElementById("loginPass").value = "";
                    } else {
                        showMsg(data.error || "Registration failed.", false);
                    }
                } catch (e) {
                    showMsg("Server not reachable.", false);
                }
                return;
            }

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("authenticatedUser", data.username);
                    window.location.href = "index.html";
                } else {
                    showMsg(data.error || "Invalid username or password.", false);
                }
            } catch (e) {
                showMsg("Server not reachable.", false);
            }
        }

        document.addEventListener("keydown", e => { if (e.key === "Enter") submitForm(); });
    </script>
</body>
</html>
